<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Valmo DICE | Hub control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1026;--mut:#6b6175;--line:#e7e1ec;--paper:#f6f4f8;--card:#fff;--rail:#26112f;--rail2:#3a1a47;
--brand:#7a1f9c;--brand2:#5b1477;--soft:#f2e8f8;
--bad:#d92d3f;--badS:#fdecee;--warn:#d97a00;--warnS:#fff3df;--good:#12924f;--goodS:#e5f5ec;--info:#2563d9;--infoS:#e8effd;--grey:#7b7484;--greyS:#eeecf0;--teal:#0e8f9b;--tealS:#e2f4f6;
--r:12px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.4 Manrope,"Segoe UI",system-ui,"Noto Sans Devanagari",sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden}
body.tv{zoom:1.22}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #b98bd0;outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
svg[viewBox="0 0 24 24"]{width:18px;height:18px;flex:none;vertical-align:-3px}
small,.mu{color:var(--mut)}small{font-size:12px}
.banner{background:var(--rail);color:#d9c6e3;font-size:12px;padding:3px 14px;display:flex;gap:10px;align-items:center;flex:none}
.banner b{color:#fff;font-weight:700}
.app{display:grid;grid-template-columns:78px minmax(0,1fr);flex:1;min-height:0}
body.tv .rail{display:none}body.tv .app{grid-template-columns:minmax(0,1fr)}
/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;overflow:auto}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,#c2358f,#7a1f9c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;margin-bottom:10px}
.rn{width:64px;border:0;background:none;color:#bda6c9;padding:8px 2px 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;position:relative}
.rn svg{width:22px;height:22px}.rn:hover{background:var(--rail2);color:#fff}
.rn.on{background:var(--rail2);color:#fff}.rn.on:before{content:"";position:absolute;left:-7px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:#e05bb0}
.rn i{position:absolute;top:2px;right:8px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:700 10px/17px Manrope,sans-serif;text-align:center;padding:0 4px;font-style:normal}
.rsp{flex:1}
/* header */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-right:6px}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:0 10px;height:36px;color:var(--mut)}
.field svg{width:16px;height:16px;flex:none}.field select,.field input{border:0;background:none;font:inherit;color:var(--ink);height:34px;outline:0;min-width:0}
.field:focus-within{border-color:var(--brand);background:#fff}.field select{font-weight:700;padding-right:4px}
.sp{flex:1}
.tr{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--paper)}
.tr .st{font-size:12px;font-weight:700;padding:0 8px;color:var(--mut)}
.ib{height:30px;min-width:30px;border-radius:8px;border:0;background:none;display:grid;place-items:center;padding:0 8px;font-weight:700;font-size:12px}
.ib svg{width:16px;height:16px}.ib:hover{background:#e9e2ee}.ib.on{background:var(--brand);color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut)}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grey)}.live.on{color:var(--good)}.live.on:before{background:var(--good);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
/* view */
.view{flex:1;min-height:0;overflow:auto;padding:14px 18px 20px}
.view.fixed{overflow:hidden;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h3{font-size:13px;font-weight:800;margin:12px 0 6px}
.sub{color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
/* buttons & chips */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.2}
.btn svg{width:16px;height:16px}.btn:hover{border-color:#cdbfd6;background:#faf7fc}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.lg{padding:12px 18px;font-size:15px;border-radius:12px}
.btn.gh{border-color:transparent;background:none;color:var(--brand)}.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--greyS);color:#4b4353;white-space:nowrap}
.chip.bad{background:var(--badS);color:var(--bad)}.chip.warn{background:var(--warnS);color:#a55a00}.chip.good{background:var(--goodS);color:var(--good)}.chip.info{background:var(--infoS);color:var(--info)}.chip.brand{background:var(--soft);color:var(--brand)}.chip.teal{background:var(--tealS);color:var(--teal)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}.seg b{font-weight:800;border-radius:8px;padding:0 6px;background:var(--greyS);font-size:12px}
.seg button.on b.bad,.seg b.bad{background:var(--bad);color:#fff}.seg b.warn{background:var(--warn);color:#fff}
.tag{font-size:10.5px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mut);background:#fff;white-space:nowrap}
/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:14px;flex:none}
.k{padding:11px 16px;border-right:1px solid var(--line);min-width:0}.k:last-child{border:0}
.k .l{font-size:12.5px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0}.k .v small{font-size:14px;font-weight:700}
.k .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k.bad .v{color:var(--bad)}.k.good .v{color:var(--good)}.k.warn .v{color:var(--warn)}
.mb{height:6px;background:var(--greyS);border-radius:4px;overflow:hidden;margin:5px 0 3px}.mb i{display:block;height:100%;background:var(--brand);border-radius:4px}
/* pipeline */
.pipe{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px 6px;flex:none}
.pg{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.gl{font-size:11px;font-weight:700;color:var(--mut);text-align:center;border-bottom:2px solid var(--line);padding-bottom:2px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl.g5{border-color:#f0b1b9;color:var(--bad)}.gl.gr{border-color:#c9e7d6;color:var(--good)}
.pn{border:0;background:none;border-radius:10px;padding:4px 2px;text-align:center;position:relative;min-width:0}
.pn:hover{background:var(--paper)}.pn.on{background:var(--soft);outline:2px solid var(--brand)}
.pn .n{font-size:22px;font-weight:800;line-height:1.1}.pn .t{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pn .r{position:absolute;top:1px;right:5px;background:var(--bad);color:#fff;font:700 10px/16px Manrope,sans-serif;border-radius:8px;min-width:16px;padding:0 4px}
.pn.held .n{color:var(--bad)}.pn.res .n{color:var(--good)}
/* floor split */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;flex:1;min-height:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{font-size:15px;font-weight:800}.pb{overflow:auto;flex:1;min-height:0}
.cap{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--paper);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.cap b{color:var(--ink)}
.qr{display:grid;grid-template-columns:22px minmax(104px,.75fr) minmax(0,1.5fr) minmax(128px,.8fr) minmax(178px,.95fr);gap:12px;align-items:center;padding:8px 14px 8px 11px;border-bottom:1px solid var(--line);border-left:5px solid transparent;cursor:pointer;background:#fff}
.qr:hover{background:#fbf9fc}.qr.sel{background:var(--soft)}
.qr.fix{border-left-color:var(--bad)}.qr.watch{border-left-color:var(--warn)}.qr.ok{border-left-color:var(--good)}.qr.done{border-left-color:#b9b2c0}
.qr.over{background:repeating-linear-gradient(135deg,#fff,#fff 8px,#faf6fc 8px,#faf6fc 16px)}
.rk{font-weight:800;color:var(--mut);text-align:center;font-size:13px}
.who{display:flex;flex-direction:column;gap:3px;min-width:0}.who b{font-size:14px}.who span{color:var(--mut)}
.who .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:1px}
.prob{display:flex;gap:8px;align-items:flex-start;font-weight:600;line-height:1.3}.prob svg{width:18px;height:18px;flex:none;margin-top:1px}
.prob.bad svg{color:var(--bad)}.prob.warn svg{color:var(--warn)}.prob.good svg{color:var(--good)}.prob.info svg{color:var(--info)}.prob.grey svg{color:var(--grey)}
.press{font-weight:800;line-height:1.15;font-size:13px}.press small{display:block;font-weight:600}.press.bad{color:var(--bad)}.press.warn{color:var(--warn)}
.act{display:flex;flex-direction:column;gap:3px;align-items:stretch}.act .btn{white-space:normal;text-align:left;justify-content:flex-start;padding:7px 12px}
.act .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);font-weight:600}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}.empty svg{width:34px;height:34px;color:var(--good);margin-bottom:6px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
/* alerts + feed */
.al{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.al.high{background:#fff8f8}.al b{font-size:13.5px}.al p{font-size:12.5px;color:var(--mut)}
.fd{padding:7px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:10px 1fr;gap:9px;font-size:12.5px;cursor:pointer}.fd:hover{background:#faf7fc}
.fd i{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--grey)}.fd.ok i{background:var(--good)}.fd.bad i{background:var(--bad)}.fd.act i{background:var(--brand)}.fd small{display:block}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}.side .panel:first-child{flex:none;max-height:44%}.side .panel:last-child{flex:1}
/* tables */
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:12px;font-weight:700;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfafc;position:sticky;top:0;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:#faf7fc}.tbl td.n,.tbl th.n{text-align:right}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:7px}.bl{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:13px}.bl .b{height:9px;background:var(--greyS);border-radius:5px;overflow:hidden}.bl .b i{display:block;height:100%;border-radius:5px;background:var(--brand)}.bl b{text-align:right}
/* rescue desk */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.kh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px 12px 0 0;font-weight:800}.kh small{font-weight:600;margin-left:auto}
.kh.blue{background:var(--infoS);color:var(--info)}.kh.orange{background:var(--warnS);color:#a55a00}.kh.grey{background:var(--greyS);color:#4b4353}.kh.green{background:var(--goodS);color:var(--good)}
.kb{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:90px}
.hc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;background:#fff}.hc:hover{border-color:#cdbfd6}
.hc.blue{border-left:4px solid var(--info)}.hc.orange{border-left:4px solid var(--warn)}.hc.grey{border-left:4px solid var(--grey)}
.win{height:6px;border-radius:4px;background:var(--greyS);overflow:hidden}.win i{display:block;height:100%;background:var(--good)}.win.low i{background:var(--bad)}.win.mid i{background:var(--warn)}
.decay{display:flex;gap:4px;align-items:flex-end;height:38px}.decay div{flex:1;background:#e5d3ef;border-radius:3px 3px 0 0;position:relative;min-height:3px}.decay div:first-child{background:var(--brand)}
.decay span{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
/* network */
.stg{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.sn{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.sn .n{font-size:26px;font-weight:800;line-height:1}.sn small{display:block}
.sn.hot{border-color:#f0b1b9;background:#fff9fa}
/* drawer */
.dr{position:fixed;top:var(--dt,0);right:0;bottom:0;width:min(580px,100%);background:#fff;z-index:40;border-left:1px solid var(--line);box-shadow:-18px 0 40px #26112f30;display:flex;flex-direction:column;animation:sl .18s ease-out}
@keyframes sl{from{transform:translateX(30px);opacity:.4}}
.dh{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.db{overflow:auto;flex:1;padding:14px 18px 30px;display:flex;flex-direction:column;gap:12px}
.do{background:var(--soft);border:1px solid #dcc3ea;border-radius:14px;padding:14px}.do .btn.lg{width:100%;margin-top:10px}
.do.must{background:#fff6e8;border-color:#f0d4a3}
.blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.blk>h3:first-child{margin-top:0}
.gs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.g1{border-radius:9px;padding:6px 2px;text-align:center;font-size:10.5px;font-weight:700;background:var(--paper);color:var(--mut);line-height:1.15;border:1px solid var(--line)}
.g1 b{display:block;font-size:14px}.g1.done{background:var(--goodS);color:var(--good);border-color:#bfe3cd}.g1.cur{background:var(--warnS);color:#a55a00;border-color:#efc37d;outline:2px solid #efc37d}.g1.cur.ok{background:var(--goodS);color:var(--good);border-color:#bfe3cd;outline-color:#bfe3cd}
.jn{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:5px 0;align-items:center;font-size:13px;border-bottom:1px dashed var(--line)}.jn:last-child{border:0}
.jn i{width:12px;height:12px;border-radius:50%;background:#d9d2df;justify-self:center}.jn.done i{background:var(--good)}.jn.current i{background:var(--warn);box-shadow:0 0 0 4px #ffe4b8}
.jn.future{color:#9b93a3}.jn small{text-align:right}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--mut)}.kv b{text-align:right}
details.blk>summary{cursor:pointer;font-weight:800;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}details.blk>summary::-webkit-details-marker{display:none}details.blk>summary:after{content:"+";margin-left:auto;color:var(--mut);font-size:18px;line-height:1}details[open].blk>summary:after{content:"-"}
details.blk[open]>summary{margin-bottom:8px}
.tl{border-left:2px solid var(--line);margin-left:5px;padding-left:12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;max-height:240px;overflow:auto}
.phone{width:250px;margin:4px auto;border:7px solid #2a1633;border-radius:28px;background:#fff;padding:14px 12px;font-size:12.5px;box-shadow:0 8px 24px #26112f30}
.phone .hd{font-weight:800;color:var(--brand);margin-bottom:6px}.phone .eta{font-size:20px;font-weight:800;margin:6px 0 2px}
.ps{display:flex;gap:8px;align-items:center;padding:3px 0;color:#9b93a3}.ps i{width:9px;height:9px;border-radius:50%;background:#d9d2df}.ps.d{color:var(--ink)}.ps.d i{background:var(--good)}.ps.c{color:var(--ink);font-weight:800}.ps.c i{background:var(--brand);box-shadow:0 0 0 3px #e8cff5}
/* modal/toast */
.mo{position:fixed;inset:0;background:#26112f80;z-index:60;display:grid;place-items:center;padding:16px}.mo>div{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.ts{background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px #0004;font-weight:600;max-width:min(560px,92vw);animation:tin .2s}.ts.bad{background:#7d1420}.ts.good{background:#0c6b3a}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 4px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:#fff;height:38px}.in:focus{border-color:var(--brand);outline:0}
.sc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:9px;font-size:13px;padding:5px 0;align-items:flex-start}.step svg{width:16px;height:16px;color:var(--good);flex:none;margin-top:2px}
.dis{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}.dis:hover{border-color:var(--brand)}.dis b{font-size:13.5px}.dis span{font-size:12.5px;color:var(--mut)}
.info{background:var(--infoS);color:#1d4bab;border-radius:10px;padding:8px 12px;font-size:12.5px}
.note{font-size:12px;color:var(--mut)}
.sk{stroke:var(--brand);fill:none;stroke-width:2}
/* responsive */

 const sub1=r.block&&r.gate===2?`${L('risk','जोखिम')} ${pc(r.r_now)}`:`${L('exp. cost','अपेक्षित लागत')} ${inr(r.c_now)}`,sub2=has?(r.block&&r.gate===2?`${L('risk','जोखिम')} ${pc(r.r_after)}`:`${L('exp. cost','अपेक्षित लागत')} ${inr(r.c_after)}`):'';

 return`<div class="qr ${r.lane} ${over?'over':''} ${S.sel===r.id?'sel':''}" onclick="openP('${r.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openP('${r.id}')">

  <p class="note" style="margin-top:4px">${L('Routine: only fixes that unlock a blocked gate run by themselves (map pin, phone check, faster lane, next wave, correct hub, re-assign rider). Everything also takes worth-doing options (like a prepaid nudge) and decides failed deliveries. Failed deliveries otherwise wait for you.','रोज़मर्रा: सिर्फ़ बंद गेट खोलने वाले काम अपने-आप (मैप पिन, फोन जांच, तेज़ रूट, अगली वेव, सही हब, राइडर बदलना)। सब कुछ में फायदेमंद विकल्प और फेल डिलीवरी भी शामिल। बाकी फेल डिलीवरी आपका इंतज़ार करती हैं।')}</p>
  <label class="f">${L('When an action is taken, does it work?','कार्रवाई करने पर क्या वह सफल होगी?')}</label>
  <select class="in" onchange="cfg({mode:this.value})">${[['sample',L('Sometimes fails, by its success chance','कभी-कभी फेल, संभावना अनुसार')],['success',L('Always works','हमेशा सफल')],['fail',L('Always fails','हमेशा फेल')]].map(([k,l])=>`<option value="${k}" ${s.mode===k?'selected':''}>${l}</option>`).join('')}</select>
  <label class="f">${L('New orders per step','हर स्टेप पर नए ऑर्डर')}: <b>${s.spawn}</b></label><input type="range" min="0" max="12" value="${s.spawn}" style="width:100%" onchange="cfg({spawn:+this.value})">
  <label class="f">${L('Rescue minutes per hub per shift','हर हब की शिफ्ट में रेस्क्यू मिनट')}: <b>${s.budget}</b> <span class="tag">ASSUMED</span></label><input type="range" min="10" max="180" step="5" value="${s.budget}" style="width:100%" onchange="cfg({budget:+this.value})">
  <p class="note">${L('Lower this to see the Intervention Budget ranking leave some fixes unfunded.','कम करें तो कुछ काम बिना क्षमता के रह जाते हैं।')}</p>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="resetSim()">${ic('reset')} ${L('Reset everything','सब रीसेट करें')}</button></div></div>
 <div class="card"><h2>${ic('bolt','')} ${L('2. Break something','2. कुछ बिगाड़ें')}</h2><p class="sub" style="margin-bottom:8px">${hub?L('Applies to','लागू होगा')+' <b>LMDC '+hub+'</b>.':L('Applies across all hubs. Pick a hub at the top to focus it on one.','सभी हब पर लागू। एक हब पर लगाने के लिए ऊपर हब चुनें।')}</p>
  <div class="grid" style="gap:8px">${DISR.map(d=>`<button class="dis" onclick="inject('${d[0]}')"><b>${L(d[1],d[2])}</b><span>${L(d[3],d[4])}</span></button>`).join('')}</div></div>
 <div class="grid" style="gap:12px"><div class="card"><h2>${ic('phone','')} ${L('3. Place a test order','3. टेस्ट ऑर्डर दें')}</h2><div class="grid g2" style="gap:8px"><div><label class="f" style="margin-top:0">${L('Product','प्रोडक्ट')}</label><input id="o_p" class="in" value="Cotton kurti set"></div><div><label class="f" style="margin-top:0">${L('Value (Rs)','मूल्य (₹)')}</label><input id="o_v" class="in" type="number" value="699"></div>
  <div><label class="f">${L('City (hub)','शहर (हब)')}</label><select id="o_c" class="in">${optsC}</select></div><div><label class="f">${L('Category','कैटेगरी')}</label><select id="o_k" class="in">${optsK}</select></div>
  <div><label class="f">${L('Payment','भुगतान')}</label><select id="o_pay" class="in"><option>COD</option><option>Prepaid</option></select></div><div><label class="f">${L('Delivery window','डिलीवरी समय')}</label><select id="o_w" class="in"><option>7-9 PM</option><option>11 AM-2 PM</option><option>Any time</option></select></div></div>
  <label class="f">${L('Address quality','पते की गुणवत्ता')}</label><select id="o_a" class="in"><option value="clear">${L('Clear, structured','साफ़, व्यवस्थित')}</option><option value="landmark">${L('Landmark-based','लैंडमार्क वाला')}</option><option value="incomplete">${L('Incomplete','अधूरा')}</option></select>
  <div class="row" style="margin-top:10px"><button class="btn pri" onclick="placeOrder()">${L('Place order','ऑर्डर दें')}</button>${o?`<button class="btn" onclick="openP('${o}')">${L('Open parcel','पार्सल खोलें')} ${o}</button>`:''}</div>
  <p class="note" style="margin-top:6px">${L('Landmark or incomplete addresses lock Gate 1, so the parcel shows up in Fix now straight away.','लैंडमार्क या अधूरा पता गेट 1 बंद करता है, इसलिए पार्सल सीधे अभी ठीक करें में दिखता है।')}</p></div>
  <div class="card"><h2>${ic('parcel','')} ${L('Guided stories','गाइडेड कहानियां')}</h2><p class="sub" style="margin-bottom:8px">${L('Each story runs one parcel through the real engine.','हर कहानी एक पार्सल को असली इंजन से चलाती है।')}</p>
  ${SC.map((c,i)=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:140px"><b>${c[0]}. ${L(c[1],c[2])}</b><br><small>${L(c[6],c[7])}</small></div><button class="btn sm" onclick="runStory(${i})" ${S.story!==null?'disabled':''}>${L('Run','चलाएं')}</button></div>`).join('')}
  <div id="storylog" style="margin-top:8px">${S.storyLog.map(x=>`<div class="step">${ic('check')}<span>${x}</span></div>`).join('')}</div></div></div></div>`}
function simAfterPaint(){const b=$('#storylog');if(b)b.scrollTop=b.scrollHeight}
async function cfg(o){try{await api('sim/config',o);await refresh()}catch(e){toast(e.message,'bad')}}
async function resetSim(){if(S.play)togglePlay();try{await api('sim/reset',{});S.sel=null;D=null;S.order=null;S.storyLog=[];await refresh();toast(L('Simulation reset. Fresh synthetic parcels loaded.','सिमुलेशन रीसेट। नए सिंथेटिक पार्सल लोड।'),'good')}catch(e){toast(e.message,'bad')}}
async function inject(kind){try{const r=await api('sim/inject',{kind,hub:S.hub});await refresh();const d=DISR.find(x=>x[0]===kind);toast(r.n?L(`${d[1]}: ${r.n} parcels hit. Check the Hub floor.`,`${d[2]}: ${r.n} पार्सल प्रभावित। हब फ़्लोर देखें।`):L('No parcel could be affected here. Press Step first.','कोई पार्सल प्रभावित नहीं। पहले स्टेप दबाएं।'),r.n?'good':'bad');if(r.n)S.view='floor',S.lane='fix',paint()}catch(e){toast(e.message,'bad')}}
async function placeOrder(){try{const v=await api('order',{product:$('#o_p').value||'Test product',value:+$('#o_v').value||699,city:$('#o_c').value,category:$('#o_k').value,payment:$('#o_pay').value,window:$('#o_w').value,address:$('#o_a').value});S.order=v.id;S.sel=v.id;D=v;await refresh();toast(L(`Order ${v.id} placed. Risk ${pc(v.risk)}.`,`ऑर्डर ${v.id} दिया। जोखिम ${pc(v.risk)}।`),'good')}catch(e){toast(e.message,'bad')}}
async function runStory(i){const c=SC[i],log=t=>{S.storyLog.push(t);paint()};S.story=i;S.storyLog=[];
 try{let v=await api('order',{product:'Cotton kurti set',value:699,city:S.hub||'Jaipur',category:'Ethnic wear',window:'7-9 PM',...c[3]});const id=v.id;S.order=id;log(`${L('Order','ऑर्डर')} ${id}: ${L('risk','जोखिम')} ${pc(v.risk)}, Gate 1 ${v.gate_ok?L('clear','साफ़'):L('locked, action needed','बंद, कार्रवाई चाहिए')}`);
  for(const st of c[4]){const reps=st[0]==='adv'?st[1]:1;for(let j=0;j<reps;j++){await sleep(220);
   if(st[0]==='adv'){for(let t=0;t<4;t++){try{v=await api(`parcel/${id}/advance`,{});break}catch(e){if(!v.rec||t===3)throw e;log(`${L('Gate locked at','गेट बंद:')} G${v.gate}. DICE applies: ${vb(v.rec.id)}`);v=await api(`parcel/${id}/act`,{action:v.rec.id,mode:'success'})}}}
   else if(st[0]==='ev')v=await api(`parcel/${id}/event`,{event:st[1]});
   else{const a=st[0]==='rec'?v.rec.id:st[1];v=await api(`parcel/${id}/act`,{action:a,mode:st[2]||'success'});log(`${L('Action','कार्रवाई')}: ${vb(a)}${st[2]==='fail'?' ('+L('did not work','सफल नहीं')+')':''}`)}}
   if(st[0]==='adv')log(`${L('Moved to','पहुंचा')}: ${v.stage_name}, ${L('risk','जोखिम')} ${pc(v.risk)}`);else if(st[0]==='ev')log(`${L('Event','घटना')}: ${st[1]}. ${L('State','स्थिति')}: ${v.state}`)}
  log(`${L('Result','नतीजा')}: ${v.outcome?outl(v.outcome):v.state} ${v.outcome===c[5]?'(matches expected)':'(expected '+c[5]+')'}`);S.sel=id;D=v}catch(e){toast(e.message,'bad');S.storyLog.push('Error: '+e.message)}
 S.story=null;await refresh()}
/* ---------- boot ---------- */
(async()=>{try{META=await api('meta');await refresh()}catch(e){document.body.insertAdjacentHTML('beforeend','<pre style="padding:20px">Could not reach the server: '+esc(e.message)+'</pre>')}})();
</script></body></html>
